<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carian Pelajar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>Sistem Maklumat Pelajar</h1>

<nav>
<a href="index.html">Utama</a>
<a href="register.html">Daftar</a>
<a href="login.html">Log Masuk</a>
<a href="search.html">Carian</a>
</nav>
</header>

<div class="container">

<h2>Carian Pengguna</h2>

<form id="searchForm">
    <input
        type="text"
        id="keyword"
        placeholder="Masukkan Nama Pengguna">

    <button type="submit" id="btnCari">
        Cari
    </button>
</form>

<p id="message"></p>

<div id="result"></div>

</div>

<script>
const searchForm = document.getElementById("searchForm");
const result = document.getElementById("result");
const message = document.getElementById("message");

searchForm.addEventListener("submit", function (e) {
    e.preventDefault();
    getUsers();
});

async function getUsers() {
    const keyword = document.getElementById("keyword").value.trim();

    try {
        message.innerHTML = "Sedang mendapatkan data...";
        message.style.color = "orange";
        result.innerHTML = "";

        // Ambil data dari localStorage (pengguna baru yang didaftar)
        let registeredUsers = JSON.parse(localStorage.getItem("registeredUsers")) || [];

        // Ambil data dari API
        const response = await fetch("https://jsonplaceholder.typicode.com/users");
        if (!response.ok) {
            throw new Error("Gagal mendapatkan data API");
        }

        const apiUsers = await response.json();

        // Gabungkan data dari localStorage dan API
        const allUsers = [...registeredUsers, ...apiUsers];

        // Tapis duplikat berdasarkan email
        const uniqueUsers = [];
        const seenEmails = new Set();
        for (const user of allUsers) {
            if (!seenEmails.has(user.email.toLowerCase())) {
                seenEmails.add(user.email.toLowerCase());
                uniqueUsers.push(user);
            }
        }

        let filtered = uniqueUsers;

        // Jika ada input, tapis berdasarkan nama
        if (keyword !== "") {
            filtered = uniqueUsers.filter((user) =>
                user.name.toLowerCase().includes(keyword.toLowerCase())
            );
        }

        if (filtered.length === 0) {
            message.innerHTML = "Tiada pengguna dijumpai";
            message.style.color = "red";
            return;
        }

        result.innerHTML = filtered
            .map(
                (user) => `
                <div class="card">
                    <h3>${user.name}</h3>
                    <p>Username: ${user.username || "N/A"}</p>
                    <p>Email: ${user.email}</p>
                    <p>Phone: ${user.phone || "N/A"}</p>
                    <p>Website: ${user.website || "N/A"}</p>
                    <p><small style="color: #999;">ID: ${user.id}</small></p>
                </div>`
            )
            .join("");

        message.innerHTML = keyword !== "" ? "Carian berjaya" : `Jumlah pengguna: ${filtered.length}`;
        message.style.color = "green";
    } catch (error) {
        message.innerHTML = `Ralat: ${error.message}`;
        message.style.color = "red";
        result.innerHTML = "";
    }
}
</script>

</body>
</html>
