<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Masuk</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>Sistem Maklumat Pelajar</h1>

<nav>
<a href="index.html">Utama</a>
<a href="register.html">Daftar</a>
<a href="login.html">Log Masuk</a>
<a href="search.html">Carian</a>
</nav>
</header>

<div class="container">

<h2>Log Masuk</h2>

<form id="loginForm">

<input
type="text"
id="loginUsername"
placeholder="Nama Pengguna"
required>

<input
type="email"
id="loginEmail"
placeholder="Email"
required>

<button type="submit">
Login
</button>

</form>

<p id="message"></p>

</div>

<script src="validation.js"></script>

<script>
const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");

loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const username = document.getElementById("loginUsername").value.trim();
    const email = document.getElementById("loginEmail").value.trim();

    if (username === "" && email === "") {
        message.innerHTML = "Nama pengguna atau email mesti diisi";
        message.style.color = "red";
        return;
    }

    if (username !== "" && !isValidUsername(username)) {
        message.innerHTML = "Nama pengguna mesti sekurang-kurangnya 3 aksara";
        message.style.color = "red";
        return;
    }

    if (email !== "" && !isValidEmail(email)) {
        message.innerHTML = "Format email tidak sah";
        message.style.color = "red";
        return;
    }

    message.innerHTML = "Sedang memproses login...";
    message.style.color = "orange";

    try {
        let user = null;
        const registeredUsers = JSON.parse(localStorage.getItem("registeredUsers")) || [];

        // Logik: Periksa localStorage dan API
        // Jika kedua-duanya diisi, keduanya mesti sepadan dengan pengguna yang sama
        // Jika hanya satu diisi, cari menggunakan satu saja

        const usernameProvided = username !== "";
        const emailProvided = email !== "";

        // Periksa localStorage dahulu
        if (usernameProvided && emailProvided) {
            // Kedua-duanya diisi - mesti sepadan dengan pengguna yang sama
            user = registeredUsers.find((item) =>
                item.username.toLowerCase() === username.toLowerCase() &&
                item.email.toLowerCase() === email.toLowerCase()
            );
        } else if (usernameProvided) {
            // Hanya username
            user = registeredUsers.find((item) =>
                item.username.toLowerCase() === username.toLowerCase()
            );
        } else if (emailProvided) {
            // Hanya email
            user = registeredUsers.find((item) =>
                item.email.toLowerCase() === email.toLowerCase()
            );
        }

        // Jika tidak dijumpai di localStorage, periksa API
        if (!user) {
            const response = await fetch("https://jsonplaceholder.typicode.com/users");
            if (!response.ok) {
                throw new Error("Gagal mendapatkan data API");
            }

            const users = await response.json();

            if (usernameProvided && emailProvided) {
                // Kedua-duanya diisi - mesti sepadan dengan pengguna yang sama
                user = users.find((item) =>
                    item.username.toLowerCase() === username.toLowerCase() &&
                    item.email.toLowerCase() === email.toLowerCase()
                );
            } else if (usernameProvided) {
                // Hanya username
                user = users.find((item) =>
                    item.username.toLowerCase() === username.toLowerCase()
                );
            } else if (emailProvided) {
                // Hanya email
                user = users.find((item) =>
                    item.email.toLowerCase() === email.toLowerCase()
                );
            }
        }

        if (!user) {
            message.innerHTML = "Nama pengguna atau email tidak dijumpai atau tidak sepadan";
            message.style.color = "red";
            return;
        }

        message.innerHTML = `Login berjaya. Selamat datang, ${user.name}`;
        message.style.color = "green";
        loginForm.reset();
    } catch (error) {
        message.innerHTML = `Ralat: ${error.message}`;
        message.style.color = "red";
    }
});
</script>

</body>
</html>
