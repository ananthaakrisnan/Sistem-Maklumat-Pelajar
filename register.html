<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Pengguna</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Sistem Maklumat Pelajar</h1>

    <nav>
        <a href="index.html">Utama</a>
        <a href="register.html">Daftar</a>
        <a href="login.html">Log Masuk</a>
        <a href="search.html">Carian</a>
    </nav>
</header>

<main>

<div class="container">

    <h2>Daftar Pengguna</h2>

    <form id="registerForm">

        <input
            type="text"
            id="name"
            placeholder="Nama Penuh"
            required>

        <input
            type="text"
            id="username"
            placeholder="Nama Pengguna"
            required>

        <input
            type="email"
            id="email"
            placeholder="Email"
            required>

        <button type="submit">
            Daftar
        </button>

    </form>

    <p id="message"></p>

</div>

</main>

<footer>
    <p>© 2026 Sistem Maklumat Pelajar</p>
</footer>

<script src="validation.js"></script>

<script>
const registerForm = document.getElementById("registerForm");
const message = document.getElementById("message");

async function submitRegistration(data) {
    const response = await fetch("https://jsonplaceholder.typicode.com/users", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    });

    if (!response.ok) {
        throw new Error("Gagal menghantar data ke API");
    }

    return response.json();
}

function generateUniqueId() {
    // Generate ID unik berdasarkan timestamp dan counter
    let registeredUsers = JSON.parse(localStorage.getItem("registeredUsers")) || [];
    const lastUser = registeredUsers[registeredUsers.length - 1];
    const lastId = lastUser ? lastUser.id : 10;
    return lastId + 1;
}

registerForm.addEventListener("submit", async function (e) {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();

    if (!isValidName(name)) {
        message.innerHTML = "Nama mesti sekurang-kurangnya 3 aksara";
        message.style.color = "red";
        return;
    }

    if (!isValidUsername(username)) {
        message.innerHTML = "Nama pengguna mesti sekurang-kurangnya 3 aksara";
        message.style.color = "red";
        return;
    }

    if (!isValidEmail(email)) {
        message.innerHTML = "Format email tidak sah";
        message.style.color = "red";
        return;
    }

    // Periksa duplikat username dan email
    let registeredUsers = JSON.parse(localStorage.getItem("registeredUsers")) || [];

    const usernameExists = registeredUsers.some((user) =>
        user.username.toLowerCase() === username.toLowerCase()
    );

    if (usernameExists) {
        message.innerHTML = "Nama pengguna sudah terdaftar. Sila gunakan nama pengguna lain";
        message.style.color = "red";
        return;
    }

    const emailExists = registeredUsers.some((user) =>
        user.email.toLowerCase() === email.toLowerCase()
    );

    if (emailExists) {
        message.innerHTML = "Email sudah terdaftar. Sila gunakan email lain";
        message.style.color = "red";
        return;
    }

    message.innerHTML = "Menghantar data...";
    message.style.color = "orange";

    try {
        // Generate ID unik untuk setiap pengguna baru
        const uniqueId = generateUniqueId();

        // Simpan ke localStorage dengan ID unik
        registeredUsers.push({ id: uniqueId, name, username, email });
        localStorage.setItem("registeredUsers", JSON.stringify(registeredUsers));

        message.innerHTML = `Pendaftaran berjaya. ID pengguna: ${uniqueId}`;
        message.style.color = "green";
        registerForm.reset();
    } catch (error) {
        message.innerHTML = `Ralat: ${error.message}`;
        message.style.color = "red";
    }
});
</script>

</body>
</html>
